services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: wastebridge }
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wastebridge
      AUTH_TRUST_HOST: "true"
    ports: ["3000:3000"]
    volumes: [uploads:/data/uploads]
    depends_on: [db]
volumes: { pgdata: {}, uploads: {} }
